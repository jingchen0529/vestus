[package]
name = "vestus"
version = "0.1.8"
edition = "2021"
rust-version = "1.82"

[lib]
name = "vestus_lib"
path = "src/lib.rs"

[[bin]]
name = "vestus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "io-util",
  "macros",
  "time",
  "sync",
] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }
url = "2"
thiserror = "2"
# CDP 只走 ws://127.0.0.1，所以关掉全部 TLS 特性，只保留握手。
tokio-tungstenite = { version = "0.29", default-features = false, features = [
  "handshake",
] }
futures-util = { version = "0.3", default-features = false, features = [
  "sink",
] }
# 持久浏览器环境的目录名取摘要，服务端下发的字符串不直接进路径。已经在依赖树里
# （tauri-codegen 用它），不引入新的下载。
sha2 = "0.10"
# 系统文件锁：兼容 Rust 1.82，进程退出时自动释放跨实例环境租约。
fs2 = "0.4"
# Local durable activity queue; bundle SQLite on every client platform.
rusqlite = { version = "0.32", features = ["bundled"] }
getrandom = "0.2"

# keyring 按平台启用原生后端，避免在 macOS 上牵入 Windows 依赖
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(unix)'.dependencies]
# waitid(WNOWAIT) keeps the owned process-group leader reserved until its tree exits.
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# An assigned Job Object owns the exact Chromium tree, including after the parent exits.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
] }
# 直接读注册表 MachineGuid：比 spawn reg query 稳，也不受系统语言影响
winreg = "0.55"
