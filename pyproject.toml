# Tooling configuration for the Vestus backend.  There is deliberately no
# [project] table: the backend is deployed from a checkout and run with
# `uvicorn app.main:app`, not installed as a distribution.

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["web", "desktop", ".venv", "migrations/versions/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM"]
ignore = [
    # FastAPI's whole dependency idiom is a call in a default argument.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# Autogenerated by `alembic revision --autogenerate` and kept as generated, so a
# future regeneration produces a reviewable diff instead of style churn.
"migrations/versions/*.py" = ["E501", "I001", "UP035", "UP006"]
# Long inline HTTP payloads and assertions read better unwrapped.
"tests/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

[tool.mypy]
python_version = "3.11"
# ``migrations`` is included on purpose: Alembic's own script template annotates
# ``upgrade()``/``downgrade()``, so generated revisions pass without an override.
files = ["app", "scripts", "migrations"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The backend is imported from the checkout root, so put it on sys.path for a
# bare `pytest` invocation too, not just `python3 -m pytest`.
pythonpath = ["."]
addopts = "-q"
