# Alembic configuration for Vestus.
#
# There is deliberately no connection URL here: migrations/env.py reads
# VESTUS_DATABASE_URL through app.core.config, so the application, the tests and
# the migrations can never disagree about which database they mean.  Override it
# for a single run with `alembic -x url=sqlite:///./local.sqlite upgrade head`.
#
# Everyday commands:
#   python3 -m alembic upgrade head                     # apply migrations
#   python3 -m alembic revision --autogenerate -m "..." # draft a new one
#   python3 scripts/init_db.py                          # adopt or create a database

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
