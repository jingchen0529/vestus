name: Release

# desktop-v* 标签推送发布；手动触发必须指定版本，只留构建 Artifacts。
# 四个平台原生准备 Chromium；同一提交的中文说明与 API 必须先通过校验。
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（x.y.z；同一提交须包含 docs/releases/desktop-v<版本号>.md）"
        required: true
        type: string
      api_base_url:
        description: "后端 API 地址（留空则用 secrets.VESTUS_API_BASE_URL）"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# 不取消进行中的发布，避免只上传部分 Release 资产。
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify release configuration and notes
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.notes.outputs.version }}
      notes_path: ${{ steps.notes.outputs.notes_path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.2"

      - name: Workflow and release helper contracts
        run: node --test .github/scripts/*.test.mjs desktop/scripts/prepare-release-api.test.mjs desktop/scripts/release-assets.test.mjs

      - name: Verify release notes before packaging
        id: notes
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: node desktop/scripts/check-release-notes.mjs --github-actions

      - name: Verify backend API before starting the matrix
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_API_BASE_URL: ${{ inputs.api_base_url }}
          SECRET_API_BASE_URL: ${{ secrets.VESTUS_API_BASE_URL }}
        run: node desktop/scripts/prepare-release-api.mjs --github-actions

  build:
    name: Build ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
          # macOS 14 已退役，分别使用支持的 ARM64 / Intel runner。
          - label: macos-aarch64
            os: macos-15
            rust_target: aarch64-apple-darwin
          - label: macos-x86_64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
          # 保留低版本 glibc 兼容性；不打需要 rpmbuild 的 rpm。
          - label: linux-x86_64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # 严格校验与说明匹配后才写 GITHUB_ENV；日志不输出 Secret / 原始输入。
      - name: Resolve backend API URL
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_API_BASE_URL: ${{ inputs.api_base_url }}
          SECRET_API_BASE_URL: ${{ secrets.VESTUS_API_BASE_URL }}
        run: node desktop/scripts/prepare-release-api.mjs --github-actions

      - name: Verify build API matches release notes
        shell: bash
        working-directory: desktop
        run: node scripts/check-release-notes.mjs "$RELEASE_VERSION" --check-api

      - name: Stamp validated version
        shell: bash
        working-directory: desktop
        run: node scripts/stamp-version.mjs "$RELEASE_VERSION"

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file patchelf libfuse2 \
            libssl-dev librsvg2-dev libxdo-dev \
            libgtk-3-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev \
            xvfb xauth libnss3 libnspr4 libatk-bridge2.0-0 libcups2 \
            libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2 libxkbcommon0

      - name: Install frontend deps
        working-directory: desktop
        run: npm ci

      - name: Install checked-in Rust toolchain and target
        shell: bash
        working-directory: desktop/src-tauri
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          rustup show active-toolchain
          rustup target add "$RUST_TARGET"

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.label }}
          save-if: false

      - name: Prepare bundled Chromium
        working-directory: desktop
        run: node scripts/prepare-chromium.mjs

      - name: Build frontend and verify boundaries
        working-directory: desktop
        run: npm test && npm run build && npm run check:surfaces

      - name: Test Rust core
        working-directory: desktop/src-tauri
        run: cargo test --locked --all-targets

      - name: Verify real Chromium control
        timeout-minutes: 15
        shell: bash
        working-directory: desktop
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:control
          else
            npm run test:control
          fi

      - name: Verify real Chromium persistence
        timeout-minutes: 15
        # Windows entry document not ready 尚未通过验收，保留非阻断与诊断产物。
        continue-on-error: ${{ runner.os == 'Windows' }}
        shell: bash
        working-directory: desktop
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:persistence
          else
            npm run test:persistence
          fi

      - name: Upload control test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-control-${{ matrix.label }}
          path: desktop/test-results/browser-control/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload persistence test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-persistence-${{ matrix.label }}
          path: desktop/test-results/browser-persistence/
          if-no-files-found: ignore
          retention-days: 14

      - name: Tauri build
        shell: bash
        working-directory: desktop
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
          RUST_TARGET: ${{ matrix.rust_target }}
        run: npm run desktop:build -- --target "$RUST_TARGET"

      - name: Collect and checksum required installers
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: node desktop/scripts/release-assets.mjs collect "$RELEASE_VERSION" "$LABEL" "desktop/src-tauri/target/$RUST_TARGET/release/bundle" release-assets

      - name: Verify final installers
        timeout-minutes: 20
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          VESTUS_INSTALLER_TEST_DISPOSABLE: "1"
        run: node desktop/scripts/verify-installers.mjs "$RELEASE_VERSION" "$LABEL" release-assets desktop/test-results/package-acceptance

      - name: Upload installer acceptance results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-acceptance-${{ matrix.label }}
          path: desktop/test-results/package-acceptance/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [preflight, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    # 手动选择 tag 也仅留 Artifacts；四个平台必须全部成功。
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.2"

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Verify all installers and checksums before publishing
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node desktop/scripts/release-assets.mjs verify "$RELEASE_VERSION" release-assets

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Vestus ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/*
          body_path: ${{ needs.preflight.outputs.notes_path }}
