name: Release

# 推 desktop-v* 标签：先检查版本说明，再四个平台原生打包并发布 GitHub Release。
# 手动触发（workflow_dispatch）：必须指定版本，只跑构建，不建 Release。
#
# 关键约束：
# - 随包 Chromium 不能跨平台也不能跨架构，所以每个目标都要在对应 runner 上原生
#   执行 desktop/scripts/prepare-chromium.mjs（Windows on ARM 没有 Chromium 构建，
#   见 desktop/src-tauri/build.rs 的拦截）。
# - 是否打包由 tauri.<platform>.conf.json 的 bundle.active 决定；根 tauri.conf.json
#   里是 active:false，所以每个平台都必须有自己的那份配置文件，否则构建会「成功
#   但没有产物」。
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（x.y.z；同一提交须包含 docs/releases/desktop-v<版本号>.md）"
        required: true
        type: string
      api_base_url:
        description: "后端 API 地址（留空则用 secrets.VESTUS_API_BASE_URL）"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Verify version release notes
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.notes.outputs.version }}
      notes_path: ${{ steps.notes.outputs.notes_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify release notes before packaging
        id: notes
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: node desktop/scripts/check-release-notes.mjs --github-actions

  build:
    name: Build ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - label: macos-aarch64
            os: macos-14
            rust_target: aarch64-apple-darwin
          # Intel 构建使用 GitHub 当前的标准 x86_64 标签；macos-13 已退役。
          - label: macos-x86_64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
          # 不打 rpm：ubuntu runner 没有 rpmbuild。
          # 用 22.04 而不是最新版：AppImage/deb 依赖构建机的 glibc，版本越低兼容越广。
          # 该 runner 退役后换 ubuntu-24.04，同时把 webkit2gtk 的包名一起确认。
          - label: linux-x86_64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file patchelf libfuse2 \
            libssl-dev librsvg2-dev libxdo-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            xvfb xauth libnss3 libnspr4 libatk-bridge2.0-0 libcups2 \
            libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2 libxkbcommon0
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev

      # 正式标签必须配置真实 HTTPS 地址，否则拒绝发布。手工试跑可显式使用
      # HTTP 测试环境；该分支会把一次性不安全开关传给受控构建包装器。
      - name: Resolve backend API URL
        shell: bash
        env:
          INPUT_API_BASE_URL: ${{ inputs.api_base_url }}
          SECRET_API_BASE_URL: ${{ secrets.VESTUS_API_BASE_URL }}
        run: |
          set -euo pipefail
          release=false
          case "${GITHUB_REF:-}" in
            refs/tags/desktop-v*) release=true ;;
          esac

          api="${INPUT_API_BASE_URL:-}"
          [ -n "$api" ] || api="${SECRET_API_BASE_URL:-}"
          if [ -z "$api" ]; then
            if [ "$release" = true ]; then
              echo "::error::正式标签构建必须配置 HTTPS 的仓库 Secret VESTUS_API_BASE_URL"
              exit 1
            fi
            api="https://vestus.invalid"
            echo "::warning::未配置 VESTUS_API_BASE_URL，使用占位地址 $api 构建；产物只能验证打包流水线，无法登录"
          fi

          case "$api" in
            https://*) ;;
            http://*)
              if [ "$release" = true ]; then
                echo "::error::正式标签的 VESTUS_API_BASE_URL 必须使用 HTTPS：$api"
                exit 1
              fi
              echo "VESTUS_ALLOW_INSECURE_API=1" >> "$GITHUB_ENV"
              echo "::warning::手工构建正在使用不安全的 HTTP API：$api"
              ;;
            *)
              echo "::error::VESTUS_API_BASE_URL 必须是 HTTP(S) 地址：$api"
              exit 1
              ;;
          esac
          echo "VESTUS_API_BASE_URL=$api" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # tag 与手动构建都使用前置检查通过的版本，避免说明、文件名和应用版本脱节。
      - name: Stamp validated version
        shell: bash
        working-directory: desktop
        run: node scripts/stamp-version.mjs "$RELEASE_VERSION"

      - name: Install frontend deps
        working-directory: desktop
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.label }}

      # 必须在 tauri build 之前：resources/chromium/ 是空目录时打出来的包能装、
      # 但点平台会报「未找到可用的 Chromium」。
      - name: Prepare bundled Chromium
        working-directory: desktop
        run: node scripts/prepare-chromium.mjs

      - name: Build frontend and verify boundaries
        working-directory: desktop
        run: npm test && npm run build && npm run check:surfaces

      - name: Test Rust core
        working-directory: desktop/src-tauri
        run: cargo test --all-targets

      - name: Verify real Chromium control
        timeout-minutes: 15
        shell: bash
        working-directory: desktop
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:control
          else
            npm run test:control
          fi

      - name: Verify real Chromium persistence
        timeout-minutes: 15
        # Windows 上导航到本地 fixture 不提交、文档停留在初始 about:blank
        # （persistence_tests 的 entry document not ready）。该门禁是 v0.2.7 之后
        # 新增的，Windows 从未验证通过；在查明根因前不阻塞发布，测试本身会
        # 记录 Target.getTargets 诊断到 browser-persistence 产物里。
        continue-on-error: ${{ runner.os == 'Windows' }}
        shell: bash
        working-directory: desktop
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:persistence
          else
            npm run test:persistence
          fi

      - name: Upload control test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-control-${{ matrix.label }}
          path: desktop/test-results/browser-control/
          if-no-files-found: ignore

      - name: Upload persistence test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-persistence-${{ matrix.label }}
          path: desktop/test-results/browser-persistence/
          if-no-files-found: ignore

      # bundle 目标来自 tauri.<platform>.conf.json：nsis / dmg / deb+appimage。
      - name: Tauri build
        working-directory: desktop
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: npm run desktop:build -- --target ${{ matrix.rust_target }}

      - name: Collect installers
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"

          bundle="desktop/src-tauri/target/$RUST_TARGET/release/bundle"
          out="release-assets"
          mkdir -p "$out"

          if [ ! -d "$bundle" ]; then
            echo "::error::未找到 bundle 目录: $bundle（检查该平台的 tauri.<platform>.conf.json 是否 active）"
            find desktop/src-tauri/target -maxdepth 4 -type d -name bundle || true
            exit 1
          fi

          found=0
          while IFS= read -r file; do
            ext="${file##*.}"
            target="$out/Vestus-${version}-${LABEL}.${ext}"
            if [ -e "$target" ]; then
              echo "::error::同名产物冲突: $target ←（$file）"
              exit 1
            fi
            cp "$file" "$target"
            echo "collected: $(basename "$target")"
            found=$((found + 1))
          done < <(find "$bundle" -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) | sort)

          if [ "$found" -eq 0 ]; then
            echo "::error::bundle 目录里没有任何安装包"
            find "$bundle" -type f | head -50
            exit 1
          fi
          ls -la "$out"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [preflight, build]
    runs-on: ubuntu-22.04
    # 只有推送标签才发版；手动选择 tag 也仅留 Artifacts。四个平台必须全部成功。
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -la release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Vestus ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/*
          body_path: ${{ needs.preflight.outputs.notes_path }}
