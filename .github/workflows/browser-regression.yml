name: Browser regression

# 显式手动启动：只运行隔离浏览器测试，不打安装包、不发布、不使用业务凭据。
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "原生测试平台"
        required: true
        default: ubuntu-22.04
        type: choice
        options:
          - ubuntu-22.04
          - windows-latest
          - macos-15

permissions:
  contents: read

# 保留正在执行的测试，让 runner 有机会完成浏览器/profile 清理。
concurrency:
  group: browser-regression-${{ github.ref }}-${{ inputs.runner }}
  cancel-in-progress: false

jobs:
  regression:
    name: Isolated browser regression (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Linux browser and Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev librsvg2-dev libxdo-dev \
            libgtk-3-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev \
            xvfb xauth libnss3 libnspr4 libatk-bridge2.0-0 libcups2 \
            libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2 libxkbcommon0

      - name: Install checked-in Rust toolchain
        working-directory: desktop/src-tauri
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
          key: browser-regression
          save-if: false

      - name: Test and build the shell
        working-directory: desktop
        run: npm ci && npm test && npm run build && npm run check:surfaces

      - name: Prepare bundled Chromium
        working-directory: desktop
        run: node scripts/prepare-chromium.mjs

      - name: Verify real Chromium control
        timeout-minutes: 15
        shell: bash
        working-directory: desktop
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:control
          else
            npm run test:control
          fi

      - name: Verify isolated persistence
        timeout-minutes: 15
        # 保留已知 Windows 非阻断限制，报告其实际 outcome，不能据此声称通过。
        continue-on-error: ${{ runner.os == 'Windows' }}
        shell: bash
        working-directory: desktop
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:persistence
          else
            npm run test:persistence
          fi

      - name: Verify synthetic material pagination
        timeout-minutes: 10
        shell: bash
        working-directory: desktop
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm run test:material-smoke
          else
            npm run test:material-smoke
          fi

      - name: Upload isolated regression reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-regression-${{ runner.os }}-${{ runner.arch }}
          path: |
            desktop/test-results/browser-control/
            desktop/test-results/browser-persistence/
            desktop/test-results/material-smoke/
          if-no-files-found: ignore
          retention-days: 14
