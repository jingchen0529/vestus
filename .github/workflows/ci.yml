name: CI

# 后端四道闸顺序与 make check 一致；pytest fixture 使用独立 SQLite。
# Web 和桌面壳先测试再构建，表面检查依赖构建产物。
# 普通 CI 不打 Tauri 安装包、不下载 Chromium；原生门禁由 Release 执行。
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: Workflow configuration gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.2"

      - name: GitHub Actions semantics (actionlint)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

      - name: Workflow contracts
        run: node --test .github/scripts/*.test.mjs

  backend:
    name: Backend gates (ruff / mypy / layers / pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check app scripts tests migrations

      - name: Type check (mypy)
        run: python -m mypy

      - name: Layering contracts (import-linter)
        run: lint-imports

      - name: Tests (pytest)
        run: python -m pytest

  web:
    name: Web gates (node --test / tsc / vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # 从 packageManager 读取精确版本；必须先安装 pnpm 再启用 setup-node 缓存。
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: web/package.json
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.2"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Tests (node --test)
        run: pnpm test
        working-directory: web

      - name: Type check and build (tsc && vite build)
        run: pnpm build
        working-directory: web

  desktop-shell:
    name: Desktop shell gates (node --test / tsc / vite build / surfaces)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: desktop

      - name: Tests (node --test)
        run: npm test
        working-directory: desktop

      - name: Type check and build (tsc && vite build)
        run: npm run build
        working-directory: desktop

      - name: Shell/kernel seam boundary check
        run: npm run check:surfaces
        working-directory: desktop

  desktop-rust:
    name: Desktop native gates (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-22.04
          - label: windows-x86_64
            os: windows-latest
          - label: macos-aarch64
            os: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev librsvg2-dev libxdo-dev \
            libgtk-3-dev libayatana-appindicator3-dev libwebkit2gtk-4.1-dev

      - name: Install checked-in Rust toolchain
        working-directory: desktop/src-tauri
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # 同时在原生 OS 验证 Node 脚本与壳构建；不依赖 dev assets 的编译例外。
      - name: Build and test the shell for generate_context
        run: npm ci && npm test && npm run build && npm run check:surfaces
        working-directory: desktop

      - name: Format check (cargo fmt --check)
        if: runner.os == 'Linux'
        run: cargo fmt --check
        working-directory: desktop/src-tauri

      - name: Tests (cargo test --lib)
        run: cargo test --locked --lib
        working-directory: desktop/src-tauri
