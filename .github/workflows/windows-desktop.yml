name: Windows desktop NSIS

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      VESTUS_API_BASE_URL: ${{ secrets.VESTUS_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release API URL
        shell: pwsh
        run: |
          if (-not $env:VESTUS_API_BASE_URL.StartsWith("https://")) {
            throw "Set repository secret VESTUS_API_BASE_URL to an HTTPS origin"
          }

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Prepare bundled Chromium
        shell: pwsh
        run: ./desktop/scripts/prepare-windows-chromium.ps1

      - name: Verify frontend boundary
        working-directory: desktop
        run: |
          npm run build
          npm run check:surfaces

      - name: Test Rust core
        working-directory: desktop/src-tauri
        run: cargo test --all-targets

      - name: Build NSIS installer
        working-directory: desktop
        run: npm run desktop:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: vestus-windows-nsis
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
